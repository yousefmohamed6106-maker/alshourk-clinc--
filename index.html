<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد - عيادة الشروق</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #1b4d89; --primary-dark: #0f3057; --gold: #d4af37; --bg-light: #f4f7fb; --text-dark: #223354; --white: #ffffff; --shadow: 0 10px 30px rgba(27, 77, 137, 0.1); --radius: 16px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; }
    header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: var(--white); padding: 30px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    header h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; }
    header p { color: var(--gold); font-size: 0.95rem; font-weight: 700; }
    .container { max-width: 500px; margin: -20px auto 0; padding: 0 16px; }
    .card { background: var(--white); border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); border: 1px solid rgba(27, 77, 137, 0.08); margin-bottom: 20px; }
    .card-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #eef2f6; padding-bottom: 10px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; color: #334155; }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; font-weight: 600; outline: none; transition: 0.2s; background: #f8fafc; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(27, 77, 137, 0.1); }
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--white); border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(27, 77, 137, 0.25); }
    .status-box { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px dashed #cbd5e1; font-size: 0.9rem; text-align: right; }
    .hidden { display: none; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: 800; font-size: 0.8rem; margin-top: 6px; }
    .status-pending { background: #fef3c7; color: #d97706; }
    .status-approved { background: #dcfce7; color: #15803d; }
    .status-rejected { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <header>
    <h1>عيادة الشروق للرعاية الطبية</h1>
    <p>حجز المواعيد والاستعلام أونلاين</p>
  </header>

  <div class="container">
    <!-- نموذج الحجز -->
    <div class="card" style="margin-top: 20px;">
      <div class="card-title"><i class="fa-solid fa-calendar-plus"></i> حجز موعد جديد</div>
      <form id="booking-form" onsubmit="submitBooking(event)">
        <div class="form-group">
          <label>اسم المريض رباعي</label>
          <input type="text" id="name" required placeholder="أدخل اسمك بالكامل">
        </div>
        <div class="form-group">
          <label>رقم الهاتف (واتساب)</label>
          <input type="tel" id="phone" required placeholder="01xxxxxxxx" pattern="[0-9]{11}">
        </div>
        <div class="form-group">
          <label>اختر العيادة والطبيب</label>
          <select id="dept" required>
            <option value="">-- اختر العيادة --</option>
            <option value="عيادة القلب - د. أسماء بركات">عيادة القلب - د. أسماء بركات</option>
            <option value="عيادة الباطنة - د. محمد إبراهيم">عيادة الباطنة - د. محمد إبراهيم</option>
          </select>
        </div>
        <div class="form-group">
          <label>نوع الكشف</label>
          <select id="service" required>
            <option value="كشف جديد">كشف جديد</option>
            <option value="إعادة / استشارة">إعادة / استشارة</option>
            <option value="فحوصات / رسم قلب">فحوصات / رسم قلب</option>
          </select>
        </div>
        <div class="form-group">
          <label>اليوم المطلوب</label>
          <input type="date" id="day" required>
        </div>
        <div class="form-group">
          <label>الوقت المفضل</label>
          <input type="time" id="time" required>
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">
          <i class="fa-solid fa-paper-plane"></i> تأكيد إرسال الحجز
        </button>
      </form>
    </div>

    <!-- الاستعلام عن الحجز -->
    <div class="card">
      <div class="card-title"><i class="fa-solid fa-magnifying-glass"></i> الاستعلام عن حالة الحجز</div>
      <div class="form-group">
        <label>أدخل رقم الهاتف للاستعلام</label>
        <input type="tel" id="check-phone" placeholder="01xxxxxxxx">
      </div>
      <button type="button" class="btn-submit" style="background: var(--primary-dark);" onclick="checkBookingStatus()">
        <i class="fa-solid fa-search"></i> فحص حالة الموعد
      </button>
      <div id="status-result" class="status-box hidden"></div>
    </div>
  </div>

  <script>
    // ضع رابط سكريبت جوجل الخاص بك هنا
    const scriptURL = "https://script.google.com/macros/s/AKfycbyFTIfyztyJRblda7Yl3MGBeBmYd_DbGOcTUnLnFNPa3rgphgsw3lXLpMlfud53mDVl/exec";

    async function submitBooking(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';

      const data = {
        action: "addBooking",
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        dept: document.getElementById('dept').value,
        service: document.getElementById('service').value,
        day: document.getElementById('day').value,
        time: document.getElementById('time').value
      };

      try {
        await fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        alert('تم إرسال طلب الحجز بنجاح! يمكنك الاستعلام برقم هاتفك لمعرفة حالة الموعد.');
        document.getElementById('booking-form').reset();
      } catch (err) {
        alert('حدث خطأ أثناء إرسال البيانات، يرجى المحاولة لاحقاً.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> تأكيد إرسال الحجز';
      }
    }

    function checkBookingStatus() {
      const phone = document.getElementById('check-phone').value.trim();
      const resDiv = document.getElementById('status-result');

      if (!phone || phone.length !== 11) {
        alert('برجاء أدخل رقم هاتف صحيح مكون من 11 رقماً.');
        return;
      }

      resDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري البحث...';
      resDiv.classList.remove('hidden');

      const oldScript = document.getElementById('status-jsonp');
      if (oldScript) oldScript.remove();

      window.handleStatusResponse = function(bookings) {
        const userBookings = bookings.filter(b => b.phone.toString() === phone);
        if (userBookings.length === 0) {
          resDiv.innerHTML = `<span style="color:#dc2626; font-weight:700;"><i class="fa-solid fa-circle-exclamation"></i> لا يوجد حجز مسجل بهذا الرقم.</span>`;
        } else {
          const latest = userBookings[userBookings.length - 1];
          let statusHtml = '';
          if (latest.status === 'pending') statusHtml = `<div class="status-badge status-pending">⏳ قيد الانتظار للمراجعة</div>`;
          else if (latest.status === 'approved') statusHtml = `<div class="status-badge status-approved">✅ تم تأكيد الموعد بنجاح</div>`;
          else if (latest.status === 'rejected') statusHtml = `<div class="status-badge status-rejected">❌ تم الاعتذار / الموعد غير متاح</div>`;

          resDiv.innerHTML = `
            <strong>الاسم:</strong> ${latest.name}<br>
            <strong>العيادة:</strong> ${latest.dept}<br>
            <strong>الموعد:</strong> ${latest.day} (${latest.time})<br>
            <div style="margin-top:8px;">${statusHtml}</div>
          `;
        }
      };

      const script = document.createElement('script');
      script.id = 'status-jsonp';
      script.src = scriptURL + "?callback=handleStatusResponse&t=" + Date.now();
      script.onerror = function() {
        resDiv.innerHTML = '<span style="color:#dc2626;">حدث خطأ في الاتصال، حاول مجدداً.</span>';
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
